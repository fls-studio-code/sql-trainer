<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#161c2b">
<title>T-SQL Тренажёр</title>
<style>
:root{
  --bg:#0f1420; --panel:#161c2b; --panel2:#1c2438; --line:#2a3550;
  --text:#e6ebf5; --muted:#8b97b3; --accent:#4f8cff; --run:#27ae60; --runh:#2ecc71;
  --err:#ff6b6b; --ok:#3ecf8e; --warn:#f5b942;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.spacer{flex:1}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:38px;touch-action:manipulation}
button:hover{border-color:var(--accent)}
button:active{transform:translateY(1px)}
button.run{background:var(--run);border-color:var(--run);color:#fff;font-weight:600;padding:8px 16px}
button.run:hover{background:var(--runh)}
button.run:disabled{opacity:.5;cursor:wait}
button.ghost{background:transparent}
button.danger:hover{border-color:var(--err);color:var(--err)}
button.sm{min-height:30px;padding:3px 9px}
.dbsel{display:flex;align-items:center;gap:6px;color:var(--muted)}
select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;max-width:46vw}
.only-mobile{display:none}

/* ---------- layout ---------- */
.body{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:0;position:relative}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.side-head b{flex:1;font-size:13px;letter-spacing:.3px}
#tree{overflow:auto;padding:6px 4px;flex:1;min-height:0}
.hint{margin:0;padding:8px 12px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
.grp{padding:4px 8px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
details{margin:0}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;min-height:32px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--muted);width:10px;font-size:11px}
details[open]>summary::before{content:"▾"}
summary:hover{background:var(--panel2)}
summary.cur .nm{font-weight:700;color:#fff}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kids{margin-left:14px;border-left:1px dashed var(--line);padding-left:6px}
.kids.cols{margin-left:20px}
.col{display:flex;justify-content:space-between;gap:8px;padding:2px 8px;color:var(--muted);font-size:13px}
.col span{color:var(--text)}
.col i{font-style:normal;font-size:12px}
.empty{color:var(--muted);padding:4px 10px;font-size:13px}
.badge{font-size:11px;color:var(--ok);border:1px solid var(--ok);border-radius:10px;padding:0 7px}
.chip{min-height:24px;padding:0 8px;font-size:11px;border-radius:12px;background:transparent;color:var(--accent);border-color:var(--accent)}

main{display:grid;grid-template-rows:minmax(150px,40%) auto minmax(0,1fr);min-height:0;min-width:0}
.editor-wrap{display:flex;flex-direction:column;min-height:0;border-bottom:1px solid var(--line)}
.snips{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
.snips::-webkit-scrollbar{display:none}
.snips button{flex:0 0 auto;min-height:32px;padding:4px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
#editor{flex:1;min-height:0;width:100%;resize:none;border:0;outline:none;background:var(--bg);color:var(--text);padding:12px;font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2;caret-color:var(--accent)}
#editor::selection{background:#2f5fbf}
.tabs{display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:8px 12px;color:var(--muted)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
#status{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:8px}
.panel{overflow:auto;min-height:0;background:var(--bg);padding:10px}
.hidden{display:none}

/* ---------- results ---------- */
.rs{margin-bottom:16px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-width:100%}
table{border-collapse:collapse;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel2);font-weight:600}
th:last-child,td:last-child{border-right:0}
td.rn,th.rn{color:var(--muted);text-align:right;background:var(--panel);width:1%}
tr:nth-child(even) td:not(.rn){background:rgba(255,255,255,.02)}
.null{color:var(--muted);font-style:italic}
.num{text-align:right}
.rs-note{color:var(--muted);font-size:12px;margin:4px 2px}
.msg{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;margin:0 0 10px}
.msg.err{color:var(--err)}
.msg.ok{color:var(--text)}
.msg.dim{color:var(--muted)}
.placeholder{color:var(--muted);padding:18px 6px}

/* ---------- mobile ---------- */
#backdrop{display:none}
@media (max-width:760px){
  .only-mobile{display:inline-block}
  .lbl{display:none}
  .body{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;z-index:30;top:0;bottom:0;left:0;width:84%;max-width:330px;transform:translateX(-102%);transition:transform .22s ease;padding-top:env(safe-area-inset-top);box-shadow:6px 0 24px rgba(0,0,0,.5)}
  aside.open{transform:none}
  #backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
  #editor{font-size:16px}
  select{max-width:38vw}
  main{grid-template-rows:minmax(150px,36%) auto minmax(0,1fr)}
  th,td{padding:7px 10px}
  summary{min-height:42px}
  .chip{min-height:30px}
  .panel{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="app">
  <header class="toolbar">
    <button id="btnTree" class="ghost only-mobile" title="Object Explorer" aria-label="Object Explorer">☰</button>
    <button id="btnRun" class="run" disabled>▶ Execute</button>
    <label class="dbsel"><span class="lbl">БД:</span><select id="dbSelect" aria-label="Текущая база данных"></select></label>
    <button class="ghost js-refresh" title="Обновить список баз и таблиц">⟳ <span class="lbl">Refresh</span></button>
    <span class="spacer"></span>
    <button id="btnSample" class="ghost">Пример</button>
    <button id="btnClear" class="ghost">Очистить</button>
    <button id="btnReset" class="ghost danger" title="Удалить все базы и начать заново">Сброс</button>
  </header>

  <div class="body">
    <div id="backdrop"></div>
    <aside id="side">
      <div class="side-head">
        <b>Object Explorer</b>
        <button class="ghost sm js-refresh" title="Обновить">⟳</button>
        <button id="btnCloseSide" class="ghost sm only-mobile" aria-label="Закрыть">✕</button>
      </div>
      <div id="tree"></div>
      <p class="hint">Базы живут в памяти браузера и сохраняются на этом устройстве. Нажми «USE», чтобы переключиться, «SELECT» — чтобы вставить запрос.</p>
    </aside>

    <main>
      <section class="editor-wrap">
        <div class="snips" id="snips">
          <button data-ins="SELECT * FROM ">SELECT</button>
          <button data-ins="INSERT INTO ">INSERT</button>
          <button data-ins="CREATE TABLE ">CREATE TABLE</button>
          <button data-ins="CREATE DATABASE ">CREATE DB</button>
          <button data-ins="USE ">USE</button>
          <button data-ins="&#10;GO&#10;">GO</button>
          <button data-ins="*">*</button>
          <button data-ins="(">(</button>
          <button data-ins=")">)</button>
          <button data-ins="'">'</button>
          <button data-ins=",">,</button>
          <button data-ins=";">;</button>
          <button data-ins="=">=</button>
        </div>
        <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"
          placeholder="Пиши запросы здесь.&#10;Выдели часть текста — выполнится только выделенное.&#10;F5 или Ctrl+Enter — Execute."></textarea>
      </section>

      <nav class="tabs">
        <button class="tab active" data-tab="results" id="tabResults">Results</button>
        <button class="tab" data-tab="messages" id="tabMessages">Messages</button>
        <span id="status">Загрузка движка…</span>
      </nav>

      <section class="panel">
        <div id="results"><div class="placeholder">Здесь появятся результаты запросов.</div></div>
        <div id="messages" class="hidden"></div>
      </section>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script>
(function () {
'use strict';

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LS_DBS = 'tsqltr_dbs', LS_CUR = 'tsqltr_cur', LS_TXT = 'tsqltr_txt';
const MAX_ROWS = 1000;

let SQL = null;
let dbs = {};
let current = 'master';
const openKeys = new Set(['db:master']);

const editor = $('#editor');
const tree = $('#tree');

/* ===================== helpers ===================== */
function TErr(num, msg) { const e = new Error(msg); e.num = num; return e; }
function findDb(name) { return Object.keys(dbs).find(k => k.toLowerCase() === String(name).toLowerCase()) || null; }
function db() { return dbs[current]; }
function newDb() { const d = new SQL.Database(); d.run('PRAGMA foreign_keys=ON'); return d; }

const toB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = b => { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };

function save() {
  try {
    const o = {};
    for (const n in dbs) { o[n] = toB64(dbs[n].export()); dbs[n].run('PRAGMA foreign_keys=ON'); }
    localStorage.setItem(LS_DBS, JSON.stringify(o));
    localStorage.setItem(LS_CUR, current);
  } catch (e) { /* хранилище недоступно или переполнено — не критично */ }
}
function restore() {
  try {
    const raw = localStorage.getItem(LS_DBS);
    if (raw) {
      const o = JSON.parse(raw);
      for (const n in o) { dbs[n] = new SQL.Database(fromB64(o[n])); dbs[n].run('PRAGMA foreign_keys=ON'); }
    }
    const c = localStorage.getItem(LS_CUR);
    if (c && dbs[c]) current = c;
    const t = localStorage.getItem(LS_TXT);
    if (t) editor.value = t;
  } catch (e) { dbs = {}; }
}

/* ===================== парсинг скрипта ===================== */
function stripComments(s) {
  let out = '', i = 0, q = false;
  while (i < s.length) {
    const c = s[i], n = s[i + 1];
    if (q) { out += c; if (c === "'") { if (n === "'") { out += n; i += 2; continue; } q = false; } i++; continue; }
    if (c === "'") { q = true; out += c; i++; continue; }
    if (c === '-' && n === '-') { while (i < s.length && s[i] !== '\n') i++; continue; }
    if (c === '/' && n === '*') { const e = s.indexOf('*/', i + 2); i = e < 0 ? s.length : e + 2; out += ' '; continue; }
    out += c; i++;
  }
  return out;
}

function splitBatches(text) {
  const batches = []; let cur = [];
  for (const line of text.split(/\r?\n/)) {
    if (/^\s*GO(?:\s+\d+)?\s*;?\s*$/i.test(line)) { batches.push(cur.join('\n')); cur = []; }
    else cur.push(line);
  }
  batches.push(cur.join('\n'));
  return batches.filter(b => b.trim());
}

const START = /^\s*(INSERT|UPDATE|DELETE|CREATE|DROP|ALTER|USE|SELECT|TRUNCATE|EXEC|EXECUTE|PRINT|DECLARE|SET|WITH)\b/i;

function shouldSplit(cur, kw) {
  const u = cur.trim().toUpperCase();
  if (kw === 'SELECT') {
    if (/^(INSERT|CREATE\s+VIEW)/.test(u) && !/\bSELECT\b/.test(u) && !/\bVALUES\b/.test(u)) return false;
    if (/(UNION(\s+ALL)?|INTERSECT|EXCEPT|\bAS)$/.test(u)) return false;
    return true;
  }
  if (kw === 'SET') return !(/^UPDATE\b/.test(u) && !/\bSET\b/.test(u));
  if (kw === 'DROP') return !/^ALTER\b/.test(u);
  return true;
}

function splitStatements(b) {
  const out = []; let cur = '', q = false, depth = 0;
  for (let i = 0; i < b.length; i++) {
    const c = b[i]; cur += c;
    if (c === "'") { q = !q; continue; }
    if (q) continue;
    if (c === '(') depth++;
    else if (c === ')') depth = Math.max(0, depth - 1);
    else if (c === ';' && depth === 0) { out.push(cur); cur = ''; }
    else if (c === '\n' && depth === 0 && cur.trim()) {
      const m = b.slice(i + 1).match(START);
      if (m && shouldSplit(cur, m[1].toUpperCase())) { out.push(cur); cur = ''; }
    }
  }
  if (cur.trim()) out.push(cur);
  return out.map(x => x.trim()).filter(Boolean);
}

/* ===================== T-SQL → SQLite ===================== */
function mapOutside(sql, fn) {
  const parts = sql.split(/('(?:[^']|'')*')/);
  return parts.map((p, i) => i % 2 ? p : fn(p, i, parts.length)).join('');
}

function translate(sql) {
  sql = sql.replace(/(^|[^\w])N'/g, "$1'");
  sql = mapOutside(sql, (p, i, L) => {
    if (i > 0 && /^\s*\+/.test(p)) p = p.replace('+', '||');
    if (i < L - 1 && /\+\s*$/.test(p)) p = p.replace(/\+(\s*)$/, '||$1');
    p = p.replace(/\[([^\]]+)\]/g, '"$1"');
    p = p.replace(/\bdbo\s*\./gi, '');
    p = p.replace(/\bDEFAULT\s+GETDATE\s*\(\s*\)/gi, 'DEFAULT CURRENT_TIMESTAMP');
    p = p.replace(/\b(?:GETDATE|SYSDATETIME)\s*\(\s*\)/gi, "datetime('now')");
    p = p.replace(/\bDB_NAME\s*\(\s*\)/gi, "'" + current.replace(/'/g, "''") + "'");
    p = p.replace(/\bLEN\s*\(/gi, 'LENGTH(');
    p = p.replace(/\bISNULL\s*\(/gi, 'IFNULL(');
    p = p.replace(/\(\s*MAX\s*\)/gi, '');
    p = p.replace(/\b(?:NON)?CLUSTERED\b/gi, '');
    p = p.replace(/\b(?:BIG|SMALL|TINY)?INT(?:EGER)?\s+(?:NOT\s+NULL\s+)?PRIMARY\s+KEY\s+IDENTITY\s*(?:\([^)]*\))?/gi, 'INTEGER PRIMARY KEY AUTOINCREMENT');
    p = p.replace(/\b(?:BIG|SMALL|TINY)?INT(?:EGER)?\s+IDENTITY\s*(?:\([^)]*\))?(\s+NOT\s+NULL)?(\s+PRIMARY\s+KEY)?/gi, 'INTEGER PRIMARY KEY AUTOINCREMENT');
    p = p.replace(/OFFSET\s+(\d+)\s+ROWS?\s+FETCH\s+(?:NEXT|FIRST)\s+(\d+)\s+ROWS?\s+ONLY/gi, 'LIMIT $2 OFFSET $1');
    return p;
  });
  sql = sql.replace(/^\s*DELETE\s+(?!FROM\b)/i, 'DELETE FROM ');
  sql = sql.replace(/^\s*INSERT\s+(?!INTO\b)/i, 'INSERT INTO ');
  sql = sql.replace(/^(\s*ALTER\s+TABLE\s+\S+\s+ADD\s+)(?!COLUMN\b|CONSTRAINT\b)/i, '$1COLUMN ');
  let limit = null;
  sql = sql.replace(/^(\s*SELECT\s+(?:DISTINCT\s+)?)TOP\s*\(?\s*(\d+)\s*\)?\s+/i, (_, a, n) => { limit = n; return a; });
  if (limit !== null) sql = sql.replace(/;?\s*$/, '') + ' LIMIT ' + limit;
  return sql;
}

function fmtErr(e) {
  const m = e && e.message ? e.message : String(e);
  if (e && e.num) return `Msg ${e.num}, Level 16, State 1\n${m}`;
  let t;
  if ((t = m.match(/no such table: (?:main\.)?(.+)/))) return `Msg 208, Level 16, State 1\nInvalid object name '${t[1]}'.`;
  if ((t = m.match(/no such column: (.+)/))) return `Msg 207, Level 16, State 1\nInvalid column name '${t[1].split('.').pop()}'.`;
  if ((t = m.match(/table "?([^"]+?)"? already exists/))) return `Msg 2714, Level 16, State 1\nThere is already an object named '${t[1]}' in the database.`;
  if ((t = m.match(/NOT NULL constraint failed: ([^.]+)\.(.+)/))) return `Msg 515, Level 16, State 2\nCannot insert the value NULL into column '${t[2]}', table '${t[1]}'; column does not allow nulls. INSERT fails.`;
  if ((t = m.match(/UNIQUE constraint failed: ([^.]+)\./))) return `Msg 2627, Level 14, State 1\nViolation of PRIMARY KEY or UNIQUE constraint. Cannot insert duplicate key in object 'dbo.${t[1]}'.`;
  if (/FOREIGN KEY constraint failed/.test(m)) return `Msg 547, Level 16, State 0\nThe statement conflicted with the FOREIGN KEY constraint.`;
  if ((t = m.match(/table (\S+) has (\d+) columns but (\d+) values/))) return `Msg 213, Level 16, State 1\nColumn name or number of supplied values does not match table definition.`;
  if ((t = m.match(/(\d+) values for (\d+) columns/))) {
    return +t[1] > +t[2]
      ? `Msg 110, Level 15, State 1\nThere are fewer columns in the INSERT statement than values specified in the VALUES clause. The number of values in the VALUES clause must match the number of columns specified in the INSERT statement.`
      : `Msg 109, Level 15, State 1\nThere are more columns in the INSERT statement than values specified in the VALUES clause. The number of values in the VALUES clause must match the number of columns specified in the INSERT statement.`;
  }
  if ((t = m.match(/near "([^"]*)": syntax error/))) return `Msg 102, Level 15, State 1\nIncorrect syntax near '${t[1]}'.`;
  if (/incomplete input/.test(m)) return `Msg 102, Level 15, State 1\nIncorrect syntax: the statement is incomplete.`;
  return `Msg 50000, Level 16, State 1\n${m}`;
}

/* ===================== проверка T-SQL-синтаксиса ===================== */
/*VALIDATE-START*/
const ALLOWED_FIRST = ['SELECT', 'WITH', 'INSERT', 'UPDATE', 'DELETE', 'CREATE', 'DROP', 'ALTER', 'USE', 'TRUNCATE', 'PRINT', 'SET', 'EXEC', 'EXECUTE', 'DECLARE'];
const NOT_SUPPORTED = ['IF', 'WHILE', 'MERGE', 'GRANT', 'REVOKE', 'DENY', 'BACKUP', 'RESTORE', 'RETURN', 'GOTO', 'BEGIN', 'COMMIT', 'ROLLBACK', 'SAVE', 'OPEN', 'FETCH', 'CLOSE', 'DEALLOCATE', 'CHECKPOINT', 'DBCC', 'KILL', 'WAITFOR', 'RAISERROR', 'THROW'];
const T_LEN = ['char', 'varchar', 'nchar', 'nvarchar', 'binary', 'varbinary'];
const T_NUM = ['decimal', 'numeric', 'dec'];
const T_ARG1 = ['float', 'time', 'datetime2', 'datetimeoffset'];
const T_NOARG = ['int', 'integer', 'bigint', 'smallint', 'tinyint', 'bit', 'date', 'datetime', 'smalldatetime', 'money', 'smallmoney', 'real', 'text', 'ntext', 'image', 'uniqueidentifier', 'xml', 'timestamp', 'rowversion', 'sql_variant'];
const T_KNOWN = [].concat(T_LEN, T_NUM, T_ARG1, T_NOARG);

function maskStrings(s) { return s.replace(/'(?:[^']|'')*'/g, x => "'" + ' '.repeat(x.length - 2) + "'"); }

function splitTop(str) {
  const out = []; let cur = '', q = false, d = 0;
  for (const c of str) {
    if (c === "'") { q = !q; cur += c; continue; }
    if (!q) {
      if (c === '(') d++;
      else if (c === ')') d--;
      else if (c === ',' && d === 0) { out.push(cur); cur = ''; continue; }
    }
    cur += c;
  }
  if (cur.trim() || out.length) out.push(cur);
  return out;
}

const stripId = x => x.trim().replace(/^[\["]|[\]"]$/g, '');

function validateCreateTable(body) {
  const defs = splitTop(body);
  if (!defs.length) throw TErr(102, "Incorrect syntax near ')'.");
  let n = 0;
  for (let i = 0; i < defs.length; i++) {
    const def = defs[i].trim();
    const last = i === defs.length - 1;
    const near = last ? ')' : ',';
    if (!def) throw TErr(102, `Incorrect syntax near '${near}'.`);
    if (/^(CONSTRAINT|PRIMARY|FOREIGN|UNIQUE|CHECK)\b/i.test(def)) continue;
    n++;
    const mm = def.match(/^(\[[^\]]+\]|"[^"]*"|\w+)\s*([\s\S]*)$/);
    if (!mm) throw TErr(102, `Incorrect syntax near '${def[0]}'.`);
    const name = stripId(mm[1]), rest = mm[2].trim();
    if (!rest) throw TErr(102, `Incorrect syntax near '${near}'.`);
    if (/^AS\b/i.test(rest)) continue;
    const tm = rest.match(/^(\w+)\s*(?:\(([^)]*)\))?/);
    if (!tm) throw TErr(102, `Incorrect syntax near '${rest[0]}'.`);
    const type = tm[1].toLowerCase();
    const args = tm[2] !== undefined ? tm[2].split(',').map(x => x.trim()) : null;
    if (!T_KNOWN.includes(type)) throw TErr(2715, `Column, parameter, or variable #${n}: Cannot find data type ${tm[1]}.`);
    if (!args) continue;
    if (T_NOARG.includes(type)) throw TErr(2716, `Column, parameter, or variable #${n}: Cannot specify a column width on data type ${type}.`);
    if (T_LEN.includes(type)) {
      if (args.length > 1) throw TErr(102, "Incorrect syntax near ','.");
      if (!/^max$/i.test(args[0])) {
        if (!/^\d+$/.test(args[0])) throw TErr(102, `Incorrect syntax near '${args[0] || ')'}'.`);
        const lim = /^n/.test(type) ? 4000 : 8000, v = +args[0];
        if (v > lim) throw TErr(131, `The size (${v}) given to the column '${name}' exceeds the maximum allowed for any data type (${lim}).`);
      }
    } else if (T_NUM.includes(type)) {
      if (args.length > 2) throw TErr(102, "Incorrect syntax near ','.");
    } else if (T_ARG1.includes(type) && args.length > 1) {
      throw TErr(102, "Incorrect syntax near ','.");
    }
  }
}

function validateTsql(s, ctx) {
  const m = maskStrings(s);
  let t;
  const fw = (m.match(/^\s*(\w+)/) || ['', ''])[1].toUpperCase();
  const fullFirst = (s.match(/^\s*(\S+)/) || ['', ''])[1];
  if (NOT_SUPPORTED.includes(fw)) throw TErr(40000, `${fw} is not supported in this trainer.`);
  if (!ALLOWED_FIRST.includes(fw)) throw TErr(102, `Incorrect syntax near '${fullFirst}'.`);

  if ((t = m.match(/\b(LIMIT|AUTO_?INCREMENT|ILIKE|UNSIGNED)\b/i))) throw TErr(102, `Incorrect syntax near '${t[1]}'.`);
  if (/\|\|/.test(m)) throw TErr(102, "Incorrect syntax near '|'.");
  if ((t = m.match(/\b(LENGTH|IFNULL|SUBSTR|INSTR|RANDOM|NOW|CURDATE|CURTIME|STRFTIME|GROUP_CONCAT|TYPEOF)\s*\(/i))) {
    throw TErr(195, `'${t[1].toUpperCase()}' is not a recognized built-in function name.`);
  }

  if (/^(SELECT|WITH|INSERT|UPDATE|DELETE)$/.test(fw)) {
    const re = /"([^"]*)"/g; let q;
    while ((q = re.exec(m))) {
      if (/\bAS\s*$/i.test(m.slice(0, q.index))) continue;
      if (ctx.hasTable(q[1]) || ctx.hasColumn(q[1])) continue;
      throw TErr(207, `Invalid column name '${q[1]}'.`);
    }
  }

  if (fw === 'CREATE') {
    if (/^\s*CREATE\s+(TEMP|TEMPORARY|VIRTUAL)\b/i.test(m)) throw TErr(102, `Incorrect syntax near '${(s.match(/^\s*CREATE\s+(\w+)/i) || ['', ''])[1]}'.`);
    if (/^\s*CREATE\s+(TABLE|DATABASE|VIEW|INDEX)\s+IF\b/i.test(m)) throw TErr(156, "Incorrect syntax near the keyword 'IF'.");
    if (/^\s*CREATE\s+TABLE\s+\S+\s+AS\b/i.test(m)) throw TErr(156, "Incorrect syntax near the keyword 'AS'.");
    const cm = m.match(/^\s*CREATE\s+TABLE\s+[^(]+\(([\s\S]*)\)\s*$/i);
    if (cm) validateCreateTable(cm[1]);
  }

  if (fw === 'INSERT') {
    const im = m.match(/^\s*INSERT\s+(?:INTO\s+)?(?:\[?dbo\]?\s*\.\s*)?[\["]?(\w+)[\]"]?\s*(?:\(([^)]*)\))?\s*(VALUES|SELECT|DEFAULT)\b/i);
    const idc = im ? ctx.identity(im[1]) : null;
    if (idc) {
      if (im[2] !== undefined) {
        const cols = im[2].split(',').map(x => stripId(x).toLowerCase());
        if (cols.includes(idc.toLowerCase())) throw TErr(544, `Cannot insert explicit value for identity column in table '${im[1]}' when IDENTITY_INSERT is set to OFF.`);
      } else if (im[3].toUpperCase() === 'VALUES') {
        const p = m.indexOf('(', m.search(/\bVALUES\b/i) + 6);
        let d = 0, e = -1;
        for (let i = p; p >= 0 && i < m.length; i++) {
          if (m[i] === '(') d++;
          else if (m[i] === ')') { d--; if (!d) { e = i; break; } }
        }
        if (e > 0 && splitTop(m.slice(p + 1, e)).length === ctx.colCount(im[1])) {
          throw TErr(8101, `An explicit value for the identity column in table '${im[1]}' can only be specified when a column list is used and IDENTITY_INSERT is ON.`);
        }
      }
    }
  }

  if (fw === 'UPDATE') {
    const um = m.match(/^\s*UPDATE\s+(?:\[?dbo\]?\s*\.\s*)?[\["]?(\w+)[\]"]?\s+SET\s+([\s\S]*)$/i);
    const idc = um ? ctx.identity(um[1]) : null;
    if (idc) {
      for (const a of splitTop(um[2].split(/\bWHERE\b/i)[0])) {
        const lm = a.match(/^\s*[\["]?(\w+)[\]"]?\s*=/);
        if (lm && lm[1].toLowerCase() === idc.toLowerCase()) throw TErr(8102, `Cannot update identity column '${idc}'.`);
      }
    }
  }
}
/*VALIDATE-END*/

function identityCol(d, t) {
  if (!/^\w+$/.test(t)) return null;
  try {
    const r = d.exec("SELECT sql FROM sqlite_master WHERE type='table' AND lower(name)=lower('" + t + "')");
    if (!r.length || !/AUTOINCREMENT/i.test(String(r[0].values[0][0]))) return null;
    const pk = columns(d, t).find(c => c.pk);
    return pk ? pk.name : null;
  } catch (e) { return null; }
}

function makeCtx() {
  const d = db();
  let objs = null;
  const getObjs = () => objs || (objs = listObjects(d));
  return {
    hasTable: n => getObjs().some(o => o.name.toLowerCase() === n.toLowerCase()),
    hasColumn: n => getObjs().some(o => columns(d, o.name).some(c => c.name.toLowerCase() === n.toLowerCase())),
    identity: t => identityCol(d, t),
    colCount: t => columns(d, t).length
  };
}

/* ===================== выполнение ===================== */
function evalExpr(expr) {
  const st = db().prepare('SELECT ' + translate(expr));
  try { st.step(); const v = st.get()[0]; return v === null ? 'NULL' : String(v); } finally { st.free(); }
}

function rowsMsg(n) { return `(${n} row${n === 1 ? '' : 's'} affected)`; }

function runStatement(raw) {
  const s = raw.trim().replace(/;+\s*$/, '').trim();
  if (!s) return {};
  let m;

  if ((m = s.match(/^USE\s+\[?(\w+)\]?\s*$/i))) {
    const k = findDb(m[1]);
    if (!k) throw TErr(911, `Database '${m[1]}' does not exist. Make sure that the name is entered correctly.`);
    current = k; openKeys.add('db:' + k);
    return { msg: 'Commands completed successfully.', changedUI: true };
  }
  if ((m = s.match(/^CREATE\s+DATABASE\s+\[?(\w+)\]?/i))) {
    if (findDb(m[1])) throw TErr(1801, `Database '${m[1]}' already exists. Choose a different database name.`);
    dbs[m[1]] = newDb();
    return { msg: 'Commands completed successfully.', changedUI: true };
  }
  if ((m = s.match(/^DROP\s+DATABASE\s+(?:IF\s+EXISTS\s+)?\[?(\w+)\]?\s*$/i))) {
    const k = findDb(m[1]);
    if (!k) {
      if (/IF\s+EXISTS/i.test(s)) return { msg: 'Commands completed successfully.' };
      throw TErr(3701, `Cannot drop the database '${m[1]}', because it does not exist or you do not have permission.`);
    }
    if (k.toLowerCase() === 'master') throw TErr(3701, `Cannot drop the system database 'master'.`);
    if (k === current) throw TErr(3702, `Cannot drop database "${k}" because it is currently in use.`);
    dbs[k].close(); delete dbs[k];
    return { msg: 'Commands completed successfully.', changedUI: true };
  }
  if (/^SET\s+\w+(\s+\w+)?\s+(ON|OFF)\s*$/i.test(s)) return {};
  if ((m = s.match(/^PRINT\s+([\s\S]+)$/i))) return { msg: evalExpr(m[1]) };
  if (/^(EXEC|EXECUTE|DECLARE)\b/i.test(s)) throw TErr(40000, 'EXEC and DECLARE are not supported in this trainer.');
  if (/^ALTER\s+TABLE[\s\S]+\bALTER\s+COLUMN\b/i.test(s)) throw TErr(40000, 'ALTER COLUMN is not supported in this trainer. Use ADD or DROP COLUMN.');
  if ((m = s.match(/^TRUNCATE\s+TABLE\s+(.+)$/i))) {
    db().run('DELETE FROM ' + translate(m[1]));
    return { msg: 'Commands completed successfully.' };
  }

  validateTsql(s, makeCtx());
  const sql = translate(s);

  if (/^(SELECT|WITH)\b/i.test(sql)) {
    const st = db().prepare(sql);
    const rows = [];
    let cols;
    try { cols = st.getColumnNames(); while (st.step()) rows.push(st.get()); } finally { st.free(); }
    return { set: { cols, rows }, msg: rowsMsg(rows.length) };
  }

  db().run(sql);
  const first = (s.match(/^\w+/) || [''])[0].toUpperCase();
  if (first === 'INSERT' || first === 'UPDATE' || first === 'DELETE') return { msg: rowsMsg(db().getRowsModified()) };
  return { msg: 'Commands completed successfully.' };
}

function execute() {
  if (!SQL) return;
  let text = editor.value, usedSel = false;
  const a = editor.selectionStart, b = editor.selectionEnd;
  if (b > a && editor.value.slice(a, b).trim()) { text = editor.value.slice(a, b); usedSel = true; }
  if (!text.trim()) { setStatus('Нечего выполнять'); return; }

  const t0 = performance.now();
  const sets = [], log = [];
  let hadErr = false;

  if (usedSel) log.push({ t: 'dim', m: '-- Выполнено только выделенное --' });

  for (const batch of splitBatches(stripComments(text))) {
    for (const stmt of splitStatements(batch)) {
      try {
        const r = runStatement(stmt);
        if (r.set) sets.push(r.set);
        if (r.msg) log.push({ t: 'ok', m: r.msg });
      } catch (e) {
        log.push({ t: 'err', m: fmtErr(e) });
        hadErr = true;
        break; // как в SSMS: ошибка прерывает текущий пакет, следующий (после GO) продолжится
      }
    }
  }

  const ms = Math.max(1, Math.round(performance.now() - t0));
  log.push({ t: 'dim', m: `Completion time: ${new Date().toLocaleTimeString()}` });

  renderResults(sets);
  renderMessages(log);
  $('#tabMessages').textContent = 'Messages' + (hadErr ? ' ⚠' : '');
  showTab(hadErr || !sets.length ? 'messages' : 'results');
  setStatus(`${hadErr ? 'Ошибка' : 'Готово'} · ${ms} мс · БД: ${current}`);
  syncUI();
  save();
}

/* ===================== отрисовка ===================== */
function cell(v) {
  if (v === null || v === undefined) return '<td class="null">NULL</td>';
  if (v instanceof Uint8Array) return '<td>0x' + Array.from(v).map(x => x.toString(16).padStart(2, '0')).join('') + '</td>';
  if (typeof v === 'number') return '<td class="num">' + esc(v) + '</td>';
  return '<td>' + esc(v) + '</td>';
}

function renderResults(sets) {
  const el = $('#results');
  if (!sets.length) { el.innerHTML = '<div class="placeholder">Нет наборов данных. Смотри вкладку Messages.</div>'; return; }
  el.innerHTML = sets.map(s => {
    const shown = s.rows.slice(0, MAX_ROWS);
    let h = '<div class="rs"><div class="tbl-wrap"><table><thead><tr><th class="rn"></th>' + s.cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>';
    shown.forEach((r, i) => { h += '<tr><td class="rn">' + (i + 1) + '</td>' + r.map(cell).join('') + '</tr>'; });
    if (!shown.length) h += '<tr><td class="rn"></td><td colspan="' + Math.max(1, s.cols.length) + '" class="null">(0 rows)</td></tr>';
    h += '</tbody></table></div>';
    if (s.rows.length > MAX_ROWS) h += '<div class="rs-note">Показаны первые ' + MAX_ROWS + ' из ' + s.rows.length + ' строк.</div>';
    return h + '</div>';
  }).join('');
}

function renderMessages(log) {
  $('#messages').innerHTML = log.map(l => '<pre class="msg ' + l.t + '">' + esc(l.m) + '</pre>').join('');
}

function showTab(name) {
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  $('#results').classList.toggle('hidden', name !== 'results');
  $('#messages').classList.toggle('hidden', name !== 'messages');
}
function setStatus(t) { $('#status').textContent = t; }

function listObjects(d) {
  try {
    const r = d.exec("SELECT name, type FROM sqlite_master WHERE type IN ('table','view') AND name NOT LIKE 'sqlite_%' ORDER BY name");
    return r.length ? r[0].values.map(v => ({ name: v[0], type: v[1] })) : [];
  } catch (e) { return []; }
}
function columns(d, t) {
  try {
    const r = d.exec('PRAGMA table_info("' + t.replace(/"/g, '""') + '")');
    return r.length ? r[0].values.map(v => ({ name: v[1], type: v[2], nn: v[3], pk: v[5] })) : [];
  } catch (e) { return []; }
}

function renderTree() {
  const names = Object.keys(dbs).sort((a, b) => a === 'master' ? -1 : b === 'master' ? 1 : a.localeCompare(b));
  let h = '<div class="grp">Databases</div>';
  for (const name of names) {
    const cur = name === current, key = 'db:' + name;
    h += `<details data-key="${esc(key)}" ${openKeys.has(key) ? 'open' : ''}><summary class="${cur ? 'cur' : ''}"><span>🗄️</span><span class="nm">${esc(name)}</span>`;
    h += cur ? '<span class="badge">active</span>' : `<button class="chip" data-use="${esc(name)}">USE</button>`;
    h += '</summary><div class="kids">';
    const objs = listObjects(dbs[name]);
    if (!objs.length) h += '<div class="empty">(нет таблиц)</div>';
    for (const o of objs) {
      const k2 = key + '/' + o.name;
      h += `<details data-key="${esc(k2)}" ${openKeys.has(k2) ? 'open' : ''}><summary><span>${o.type === 'view' ? '👁️' : '📋'}</span><span class="nm">dbo.${esc(o.name)}</span>`;
      if (cur) h += `<button class="chip" data-sel="${esc(o.name)}">SELECT</button>`;
      h += '</summary><div class="kids cols">';
      for (const c of columns(dbs[name], o.name)) {
        h += `<div class="col"><span>${esc(c.name)}</span><i>${esc(c.type || '')}${c.pk ? ' · PK' : ''}${c.nn && !c.pk ? ' · NOT NULL' : ''}</i></div>`;
      }
      h += '</div></details>';
    }
    h += '</div></details>';
  }
  tree.innerHTML = h;
}

function renderSelect() {
  const sel = $('#dbSelect');
  const names = Object.keys(dbs).sort((a, b) => a === 'master' ? -1 : b === 'master' ? 1 : a.localeCompare(b));
  sel.innerHTML = names.map(n => `<option value="${esc(n)}" ${n === current ? 'selected' : ''}>${esc(n)}</option>`).join('');
}

function syncUI() { renderSelect(); renderTree(); }

/* ===================== события ===================== */
function insertAtCursor(text) {
  const a = editor.selectionStart, b = editor.selectionEnd;
  editor.setRangeText(text, a, b, 'end');
  editor.focus();
  localStorage.setItem(LS_TXT, editor.value);
}

function closeSide() { $('#side').classList.remove('open'); $('#backdrop').classList.remove('show'); }
function openSide() { $('#side').classList.add('open'); $('#backdrop').classList.add('show'); }

const SAMPLE = `-- Пример: первый урок
CREATE DATABASE School
GO

USE School
GO

CREATE TABLE Students (
  Id INT IDENTITY(1,1) PRIMARY KEY,
  FirstName NVARCHAR(50) NOT NULL,
  LastName NVARCHAR(50) NOT NULL,
  Age INT
)
GO

INSERT INTO Students (FirstName, LastName, Age)
VALUES (N'Ion', N'Rusu', 17),
       (N'Maria', N'Popa', 16),
       (N'Andrei', N'Ceban', 18)
GO

SELECT * FROM Students
SELECT TOP 2 FirstName, LastName FROM Students ORDER BY Age DESC
`;

function bind() {
  $('#btnRun').addEventListener('click', execute);
  $$('.js-refresh').forEach(b => b.addEventListener('click', () => { syncUI(); setStatus('Список обновлён · БД: ' + current); }));
  $('#btnTree').addEventListener('click', openSide);
  $('#btnCloseSide').addEventListener('click', closeSide);
  $('#backdrop').addEventListener('click', closeSide);
  $$('.tab').forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));

  $('#dbSelect').addEventListener('change', e => { current = e.target.value; openKeys.add('db:' + current); syncUI(); save(); setStatus('USE ' + current); });

  $('#btnSample').addEventListener('click', () => {
    if (editor.value.trim() && !confirm('Заменить текущий текст примером?')) return;
    editor.value = SAMPLE; localStorage.setItem(LS_TXT, SAMPLE); editor.scrollTop = 0;
  });
  $('#btnClear').addEventListener('click', () => { editor.value = ''; localStorage.setItem(LS_TXT, ''); editor.focus(); });
  $('#btnReset').addEventListener('click', () => {
    if (!confirm('Удалить ВСЕ базы и таблицы на этом устройстве?')) return;
    for (const n in dbs) dbs[n].close();
    dbs = { master: newDb() }; current = 'master'; openKeys.clear(); openKeys.add('db:master');
    save(); syncUI(); renderResults([]); renderMessages([{ t: 'ok', m: 'Всё сброшено.' }]); showTab('messages'); setStatus('Сброс выполнен');
  });

  editor.addEventListener('input', () => { try { localStorage.setItem(LS_TXT, editor.value); } catch (e) {} });
  editor.addEventListener('keydown', e => {
    if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key === 'Enter')) { e.preventDefault(); execute(); }
    else if (e.key === 'Tab') { e.preventDefault(); insertAtCursor('  '); }
  });

  const snips = $('#snips');
  snips.addEventListener('mousedown', e => e.preventDefault());
  snips.addEventListener('click', e => { const b = e.target.closest('button[data-ins]'); if (b) insertAtCursor(b.dataset.ins); });

  tree.addEventListener('toggle', e => {
    const d = e.target;
    if (d && d.dataset && d.dataset.key) { d.open ? openKeys.add(d.dataset.key) : openKeys.delete(d.dataset.key); }
  }, true);
  tree.addEventListener('click', e => {
    const u = e.target.closest('button[data-use]');
    if (u) { e.preventDefault(); current = u.dataset.use; openKeys.add('db:' + current); syncUI(); save(); setStatus('USE ' + current); return; }
    const s = e.target.closest('button[data-sel]');
    if (s) { e.preventDefault(); insertAtCursor('SELECT * FROM ' + s.dataset.sel + '\n'); closeSide(); }
  });
}

/* ===================== старт ===================== */
async function init() {
  bind();
  if (typeof initSqlJs !== 'function') {
    setStatus('Не удалось загрузить движок');
    $('#results').innerHTML = '<div class="placeholder">Не загрузился sql.js с cdnjs.cloudflare.com. Проверь интернет и обнови страницу.</div>';
    return;
  }
  try {
    SQL = await initSqlJs({ locateFile: f => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/' + f });
  } catch (e) {
    setStatus('Ошибка загрузки движка');
    $('#results').innerHTML = '<div class="placeholder">Не удалось запустить sql.js: ' + esc(e.message || e) + '</div>';
    return;
  }
  restore();
  if (!dbs.master) dbs.master = newDb();
  if (!dbs[current]) current = 'master';
  openKeys.add('db:' + current);
  syncUI();
  $('#btnRun').disabled = false;
  setStatus('Готово · БД: ' + current);
}
init();
})();
</script>
</body>
